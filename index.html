<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MineOs</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@600&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#171c28;--panel:#222a3b;--line:#33405a;--text:#e9eef7;--muted:#93a0b8;--torch:#ffb454;--bad:#ff7a7a;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Figtree,system-ui,sans-serif;padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px,env(safe-area-inset-left))}
main{max-width:560px;margin:0 auto;padding:28px 0}
h1{font:600 34px 'Pixelify Sans',monospace;margin:0 0 4px}h2{font:600 20px 'Pixelify Sans',monospace;margin:28px 0 10px}
p.sub{color:var(--muted);margin:0 0 20px}
.panel{background:var(--panel);border:2px solid var(--line);padding:16px;margin-bottom:12px}
input,select{width:100%;padding:11px;margin:0 0 10px;background:var(--bg);color:var(--text);border:2px solid var(--line);font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--torch);outline-offset:1px}
button{font:600 16px Figtree;padding:11px 16px;background:var(--torch);color:#241705;border:0;cursor:pointer}
button.ghost{background:none;color:var(--text);border:2px solid var(--line)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.row>div{min-width:0}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1}
.err{color:var(--bad);min-height:1.4em;margin:0 0 8px}.muted{color:var(--muted);font-size:14px}
.dot{display:inline-block;width:10px;height:10px;margin-right:6px;background:var(--muted)}.running .dot{background:#7bd88f}.starting .dot{background:var(--torch)}
#wait{position:fixed;inset:0;overflow:auto;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
#blocks{display:flex;gap:6px}#blocks i{width:26px;height:26px;background:var(--panel);border:2px solid var(--line)}#blocks i.on{background:var(--torch);border-color:var(--torch)}
#game{position:fixed;top:0;left:0;width:100%;height:100vh;height:100dvh;display:none;background:#000}#game iframe{width:100%;height:100%;border:0}
#game button{position:absolute;top:calc(env(safe-area-inset-top) + 8px);right:8px;z-index:2}
@media(orientation:landscape) and (max-height:500px){main{max-width:760px;padding:12px 0}h1{font-size:26px}h2{margin:16px 0 8px}#wait{justify-content:flex-start;gap:10px;padding:12px}#blocks i{width:20px;height:20px}}
@media(prefers-reduced-motion:no-preference){#blocks i.on{transition:background .4s}}
</style></head><body>
<main>
 <h1>MineOs</h1><p class="sub">Tarayıcıdan Minecraft Java. İndirme yok.</p>

 <section id="auth"><div class="panel">
  <div class="tabs"><button id="tL">Giriş yap</button><button id="tR" class="ghost">Kayıt ol</button></div>
  <input id="u" placeholder="Kullanıcı adı" autocomplete="username" maxlength="16">
  <input id="p" type="password" placeholder="Şifre" autocomplete="current-password">
  <div id="reg" hidden>
   <input id="p2" type="password" placeholder="Şifre (tekrar)" autocomplete="new-password">
   <input id="em" type="email" placeholder="Gmail (isteğe bağlı, mesaj gelmez)">
  </div>
  <div class="err" id="aerr"></div><button id="go">Giriş yap</button>
 </div></section>

 <section id="app" hidden>
  <div class="row"><span>Merhaba, <b id="who"></b></span><button class="ghost" id="out">Çıkış</button></div>
  <h2>Sunucularım</h2><div id="list"></div>
  <h2>Yeni sunucu</h2>
  <div class="panel">
   <input id="sn" placeholder="Sunucu adı" maxlength="24">
   <select id="sv"><option>1.21.4</option><option>1.20.1</option><option>1.19.4</option><option>1.18.2</option></select>
   <p class="muted">En fazla 50 oyuncu. Sunucu kapanınca dünya kaydedilir; girmek isteyen olunca otomatik açılır.</p>
   <div class="err" id="serr"></div><button id="mk">Sunucuyu oluştur</button>
  </div>
 </section>
</main>

<div id="wait"><h2 id="wt">Sunucu uyanıyor…</h2><div id="blocks"></div><p class="muted" id="ws">Genelde 30-40 saniye sürer. Dünyan olduğu gibi yüklenecek.</p><button class="ghost" id="wc">Vazgeç</button></div>

<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);let tok=localStorage.mt||"",user=localStorage.mu||"",mode="L",timer;
const api=async(p,o={})=>{const r=await fetch("/api/"+p,{method:o.body?"POST":"GET",headers:{authorization:"Bearer "+tok},body:o.body&&JSON.stringify(o.body)});const j=await r.json();if(!r.ok)throw Error(j.error||"Hata");return j};
const tab=m=>{mode=m;$("reg").hidden=m=="L";$("go").textContent=m=="L"?"Giriş yap":"Hesap oluştur";$("tL").className=m=="L"?"":"ghost";$("tR").className=m=="R"?"":"ghost"};
$("tL").onclick=()=>tab("L");$("tR").onclick=()=>tab("R");
$("go").onclick=async()=>{$("aerr").textContent="";try{const j=await api(mode=="L"?"login":"register",{body:{username:$("u").value,password:$("p").value,password2:$("p2").value,email:$("em").value}});tok=localStorage.mt=j.token;user=localStorage.mu=j.username;show()}catch(e){$("aerr").textContent=e.message}};
$("out").onclick=()=>{localStorage.clear();tok="";show()};
async function show(){$("auth").hidden=!!tok;$("app").hidden=!tok;if(!tok)return;$("who").textContent=user;
 try{const l=await api("servers");$("list").innerHTML=l.length?"":'<p class="muted">Henüz sunucun yok. Aşağıdan bir tane oluştur.</p>';
 l.forEach(s=>{const d=document.createElement("div");d.className="panel row "+s.status;d.innerHTML=`<div><b></b><div class="muted"><span class="dot"></span>${{sleeping:"Uyuyor",starting:"Açılıyor",running:"Açık"}[s.status]} · ${s.version} · ${s.maxPlayers} kişi</div></div><button>Gir</button>`;d.querySelector("b").textContent=s.name;d.querySelector("button").onclick=()=>join(s.id);$("list").append(d)})}catch(e){if(/Giriş/.test(e.message)){tok="";show()}}}
$("mk").onclick=async()=>{$("serr").textContent="";try{await api("servers",{body:{name:$("sn").value||"Sunucum",version:$("sv").value}});$("sn").value="";show()}catch(e){$("serr").textContent=e.message}};
async function join(id){$("wait").style.display="flex";$("wt").textContent="Sunucu uyanıyor…";let first=true;
 $("blocks").innerHTML="<i></i>".repeat(8);
 const tick=async()=>{try{const s=await api(`servers/${id}/${first?"join":"status"}`,{body:first?{}:undefined});first=false;
  const n=Math.min(8,Math.floor(s.elapsed/s.wakeMs*8));[...$("blocks").children].forEach((b,i)=>b.className=i<n?"on":"");
  if(s.status=="running"){$("wt").textContent="Hazır!";play(s)}else timer=setTimeout(tick,3000)}catch(e){$("ws").textContent=e.message;timer=setTimeout(tick,5000)}};tick()}
$("wc").onclick=()=>{clearTimeout(timer);$("wait").style.display="none";show()};
function play(s){clearTimeout(timer);const c=window.MINEOS,q=new URLSearchParams({ip:`${s.host}:${s.port}`,version:s.version,username:user,lockConnect:"true"});const px=s.proxy||c.PROXY_URL;if(px)q.set("proxy",px);
 location.href=`${c.CLIENT_URL}/?${q}`}
show();
</script></body></html>
